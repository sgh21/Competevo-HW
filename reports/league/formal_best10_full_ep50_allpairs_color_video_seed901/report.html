<script>
const DATA = JSON.parse(document.getElementById('report-data').textContent);
const COLORS = ['#087ea4','#d47300','#198754','#7b61ff','#c2410c','#0f766e','#be185d','#64748b'];
const fmt = (x,d=2)=> x===null||x===undefined||Number.isNaN(x) ? '-' : Number(x).toFixed(d);
const pct = x => x===null||x===undefined ? '-' : (Number(x)*100).toFixed(1)+'%';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const signed = x => x>=0 ? `<span class="pos">+${fmt(x,1)}</span>` : `<span class="neg">${fmt(x,1)}</span>`;
function card(label, value, sub=''){return `<div class="card"><div class="metric">${value}<small>${label}</small></div>${sub?`<div class="muted">${sub}</div>`:''}</div>`}
function renderOverview(){
 const c=DATA.counts, s=DATA.settings, top=DATA.leaderboard[0];
 document.getElementById('overview').innerHTML=`<h2>实验概览</h2><div class="grid cards">${card('参赛 agent',c.agents)}${card('unordered pair',c.pairs)}${card('fixture',c.fixtures)}${card('总局数',c.episodes)}${card('视频',c.videos)}${card('冠军',esc(top.agent_id),`points ${fmt(top.points,0)} / win ${pct(top.win_rate)}`)}</div><div class="note">赛制为 10 agent 全循环双回合，每个 pair 进行 A/B 与 B/A 两个 slot-swap fixture；每个 fixture ${s.episodes} 局；胜 4 分，平 1 分，负 0 分。视频仅录每个 pair 的部分 episode，但完整胜负统计来自全部 ${c.episodes} 局。</div>`;
}
function renderConclusions(){
 const top=DATA.leaderboard.slice(0,5).map(r=>`${r.rank}. ${r.agent_id} (${fmt(r.points,0)} pts, win ${pct(r.win_rate)}, ΔR ${fmt(r.avg_reward_margin,1)})`).join('<br>');
 const gs=DATA.group_summary.map(g=>`${g.group}: avg points ${fmt(g.avg_points,1)}, avg win ${pct(g.avg_win_rate)}, best ${g.best_agent}`).join('<br>');
 const pr=DATA.pair_extremes;
 document.getElementById('conclusions').innerHTML=`<h2>结论摘要</h2><div class="grid" style="grid-template-columns:1.2fr 1fr;gap:14px"><div class="card"><h3>积分赛结论</h3><ul class="summary-list"><li><b>形态优化整体占优。</b>冠军是 <b>${DATA.leaderboard[0].agent_id}</b>，亚军是 <b>${DATA.leaderboard[1].agent_id}</b>，前三均为 morph 相关策略。</li><li><b>混合训练中的 morph agent0 最强。</b> ${DATA.leaderboard[0].agent_id} 以 ${fmt(DATA.leaderboard[0].points,0)} 分排名第一，同时 avg reward margin 达 ${fmt(DATA.leaderboard[0].avg_reward_margin,1)}。</li><li><b>delay200 这组在本次 best checkpoint 积分赛中没有超过原 tp-morph。</b> delayed 两个 agent 排名靠后，说明“先控制后形态”的想法可行但当前实现/训练结果还没带来更强对抗能力。</li><li><b>单看训练曲线仍不足以判断最终强弱。</b> 训练 win rate 面对的是当前训练对手或 selfplay 评估，固定池积分赛更能反映跨策略泛化。</li></ul></div><div class="card"><h3>Top 5</h3><p>${top}</p><h3>训练组聚合</h3><p>${gs}</p></div></div><div class="note warn">注意：训练曲线中的 reward/win rate 主要用于诊断学习过程，不等价于最终能力排名。最终强弱以固定候选池、双回合、同 seed 协议下的积分赛为准。</div>`;
}

function renderComposite(){
 const rows=DATA.composite_ranking||[]; if(!rows.length) return;
 const rule=DATA.composite_rule, strong=(DATA.strong_pool||[]).join(', ');
 const champ=rows[0], base=DATA.leaderboard[0];
 const bar=(v,max=50,color='#087ea4')=>`<div style="height:8px;background:#ece8df;border-radius:999px;min-width:80px"><span style="display:block;height:8px;width:${Math.max(2,Math.min(100,v/max*100))}%;background:${color};border-radius:999px"></span></div>`;
 const delta=x=>x>0?`<span class="pos">+${x}</span>`:(x<0?`<span class="neg">${x}</span>`:'0');
 const rankRows=rows.map(r=>`<tr><td>${r.composite_rank}</td><td>${esc(r.agent_id)}</td><td>${fmt(r.final_score,2)}</td><td>${fmt(r.points_component,2)}${bar(r.points_component,50,'#087ea4')}</td><td>${fmt(r.reward_component,2)}${bar(r.reward_component,20,'#198754')}</td><td>${fmt(r.major_component,2)}${bar(r.major_component,30,'#d47300')}</td><td>${r.base_rank}</td><td>${delta(r.rank_delta)}</td><td>${fmt(r.points,0)}</td><td>${fmt(r.avg_reward,1)}</td><td>${fmt(r.avg_reward_margin,1)}</td><td>${fmt(r.major_points_per_episode,3)}</td><td>${fmt(r.major_points,0)} / ${r.major_episodes}</td><td>${r.major_wins}-${r.major_draws}-${r.major_losses}</td><td>${r.major_opponents.map(esc).join('<br>')}</td></tr>`).join('');
 const detailRows=(DATA.major_details||[]).map(d=>`<tr><td>${esc(d.agent_id)}</td><td>${esc(d.opponent_id)}</td><td>${fmt(d.points,0)}</td><td>${fmt(d.points_per_episode,3)}</td><td>${d.wins}-${d.draws}-${d.losses}</td><td>${pct(d.wins/d.episodes)}</td><td>${pct(d.draws/d.episodes)}</td><td>${fmt(d.avg_reward,1)}</td><td>${signed(d.avg_reward_margin)}</td></tr>`).join('');
 document.getElementById('composite').innerHTML=`<h2>综合榜单：积分 + Reward + 大赛积分</h2><div class="grid cards">${card('综合第一',esc(champ.agent_id),`score ${fmt(champ.final_score,2)}`)}${card('原积分第一',esc(base.agent_id),`${fmt(base.points,0)} pts`)}${card('强者池',strong,`原积分榜前三`)}${card('权重','50 / 20 / 30','积分 / reward / 大赛积分')}${card('大赛归一化',fmt(rule.max_major_points_per_episode,3),'最高每局大赛积分')}${card('排名变化最大',esc(rows.reduce((a,b)=>Math.abs(b.rank_delta)>Math.abs(a.rank_delta)?b:a).agent_id),`Δrank ${rows.reduce((a,b)=>Math.abs(b.rank_delta)>Math.abs(a.rank_delta)?b:a).rank_delta}`)}</div><div class="note">综合分公式：<span class="src">${esc(rule.formula)}</span>。积分项使用总积分除以最高总积分；reward 项使用积分榜 <span class="src">avg_reward</span> 的 min-max 归一化；大赛积分项使用“对强者池每局积分”归一化。强者池固定为原积分榜前三：<b>${strong}</b>，前三名自身只统计与另外两名强者的直接对局，避免递归排名。</div><div class="table-wrap"><table><thead><tr><th>综合 Rank</th><th>Agent</th><th>Score</th><th>积分贡献</th><th>Reward 贡献</th><th>大赛贡献</th><th>原积分 Rank</th><th>Rank Δ</th><th>Points</th><th>Avg Reward</th><th>Reward Margin</th><th>大赛 Pts/Ep</th><th>大赛 Points/Episodes</th><th>大赛 W-D-L</th><th>大赛对手</th></tr></thead><tbody>${rankRows}</tbody></table></div><h3>大赛对局明细</h3><p class="muted">这里列出每个 agent 被计入大赛积分的对局。非前三名统计其对原前三名的 3 个 pair；前三名统计互相之间的 2 个 pair。</p><div class="table-wrap"><table><thead><tr><th>Agent</th><th>Opponent</th><th>Points</th><th>Pts/Ep</th><th>W-D-L</th><th>Win</th><th>Draw</th><th>Avg Reward</th><th>Reward Margin</th></tr></thead><tbody>${detailRows}</tbody></table></div><div class="note warn">结论补充：按综合分，<b>${esc(champ.agent_id)}</b> 超过原积分冠军 <b>${esc(base.agent_id)}</b>。主要原因是它的 avg reward 更高，并且对强者池的每局大赛积分达到 ${fmt(champ.major_points_per_episode,3)}，略高于原积分冠军的 ${fmt(rows.find(r=>r.agent_id===base.agent_id).major_points_per_episode,3)}。</div>`;
}

function renderLeaderboard(){
 const rows=DATA.leaderboard.map(r=>`<tr><td>${r.rank}</td><td>${esc(r.agent_id)}</td><td>${esc(r.display_name)}</td><td>${fmt(r.points,0)}</td><td>${fmt(r.points_per_episode,3)}</td><td>${r.wins}/${r.draws}/${r.losses}</td><td>${pct(r.win_rate)}</td><td>${pct(r.draw_rate)}</td><td>${fmt(r.avg_reward,1)}</td><td>${signed(r.avg_reward_margin)}</td><td>${fmt(r.avg_episode_length,1)}</td><td>${pct(r.agent0_win_rate)}</td><td>${pct(r.agent1_win_rate)}</td><td>${pct(r.left_win_rate)}</td><td>${pct(r.right_win_rate)}</td></tr>`).join('');
 const agents=DATA.agents.map(a=>`<tr><td>${esc(a.agent_id)}</td><td>${esc(a.training_line)}</td><td>${esc(a.training_mode)}</td><td>${esc(a.source_role)}</td><td>${a.morph_enabled?'yes':'no'}</td><td class="src">${esc(a.run_dir)}</td></tr>`).join('');
 document.getElementById('leaderboard').innerHTML=`<h2>积分榜与参赛来源</h2><div class="table-wrap"><table><thead><tr><th>Rank</th><th>Agent</th><th>Name</th><th>Points</th><th>Pts/Ep</th><th>W/D/L</th><th>Win</th><th>Draw</th><th>Avg Reward</th><th>Reward Margin</th><th>Len</th><th>agent0 win</th><th>agent1 win</th><th>left win</th><th>right win</th></tr></thead><tbody>${rows}</tbody></table></div><h3>参赛者来源</h3><div class="table-wrap"><table><thead><tr><th>Agent</th><th>Training line</th><th>Mode</th><th>Source role</th><th>Morph action</th><th>Run dir</th></tr></thead><tbody>${agents}</tbody></table></div>`;
}
function matrixCell(a,b){
 if(a===b) return '<td class="diag">-</td>';
 const c=DATA.match_matrix[a][b];
 let cls=c.win_rate>=0.45?'winhi':(c.win_rate>=0.3?'winmid':'winlo');
 if(c.draw_rate>=0.55) cls += ' drawhi';
 return `<td class="${cls}"><b>${c.wins}-${c.draws}-${c.losses}</b><br>WR ${pct(c.win_rate)}<br>ΔR ${fmt(c.avg_reward_margin,0)}</td>`;
}
function renderMatrix(){
 const order=DATA.leader_order;
 const head='<tr><th>row vs col</th>'+order.map(a=>`<th>${esc(a)}</th>`).join('')+'</tr>';
 const body=order.map(a=>`<tr><th>${esc(a)}</th>${order.map(b=>matrixCell(a,b)).join('')}</tr>`).join('');
 document.getElementById('matrix').innerHTML=`<h2>10 x 10 对局结果表</h2><p class="muted">每个单元从“行 agent”视角显示 W-D-L、胜率和平均 reward margin。绿色表示行 agent 胜率较高，红色表示较低，底部金线表示高平局率。</p><div class="table-wrap"><table class="matrix"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
function renderPairs(){
 const rows=DATA.pairs.map(p=>`<tr><td>${esc(p.pair_id)}</td><td>${p.episodes}</td><td>${p.agent_a_wins}-${p.draws}-${p.agent_b_wins}</td><td>${fmt(p.agent_a_points,0)} : ${fmt(p.agent_b_points,0)}</td><td>${pct(p.agent_a_win_rate)} / ${pct(p.agent_b_win_rate)}</td><td>${pct(p.draw_rate)}</td><td>${fmt(p.agent_a_avg_reward,1)} / ${fmt(p.agent_b_avg_reward,1)}</td><td>${signed(p.agent_a_avg_reward_margin)}</td><td>${fmt(p.avg_episode_length,1)}</td><td>${p.video_paths&&p.video_paths.length?`<a href="${esc(p.video_paths[0].replace(DATA.out_dir+'/',''))}">video</a>`:''}</td></tr>`).join('');
 document.getElementById('pairs').innerHTML=`<div class="section-sub"><h2>每对比赛记录</h2><input class="filter" id="pairFilter" placeholder="过滤 pair / agent"></div><div class="table-wrap"><table id="pairTable"><thead><tr><th>Pair</th><th>Episodes</th><th>A-D-B</th><th>Points</th><th>Win rate A/B</th><th>Draw</th><th>Avg reward A/B</th><th>Margin A</th><th>Len</th><th>Video</th></tr></thead><tbody>${rows}</tbody></table></div>`;
 document.getElementById('pairFilter').addEventListener('input', e=>{const q=e.target.value.toLowerCase(); document.querySelectorAll('#pairTable tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none')});
}
function renderVideos(){
 const rankRows=(DATA.composite_ranking&&DATA.composite_ranking.length?DATA.composite_ranking.map(r=>({agent_id:r.agent_id,rank:r.composite_rank})):DATA.leaderboard.map(r=>({agent_id:r.agent_id,rank:r.rank})));
 const rankByAgent=Object.fromEntries(rankRows.map(r=>[r.agent_id,r.rank]));
 const rankLabel=id=>{const r=rankByAgent[id]; return r===1?'综合冠军':(r===2?'综合亚军':(r===3?'综合季军':(r?`综合第${r}名`:'未排名')))};
 const cards=DATA.classic_videos.map(v=>`<div class="card video-card"><h3>${esc(v.title)}</h3><p><span class="pill">${esc(v.score)}</span><span class="pill">draw ${pct(v.draw_rate)}</span><span class="pill">margin ${fmt(v.margin,1)}</span></p><video controls preload="metadata" src="${esc(v.src)}"></video><p class="muted">${esc(v.note)}</p><p class="src">${esc(v.src)}</p></div>`).join('');
 const allCards=DATA.pairs.map((p,i)=>{const src=(p.video_paths&&p.video_paths.length?p.video_paths[0].replace(DATA.out_dir+'/',''):''); const score=`${p.agent_a_id} ${p.agent_a_wins}-${p.draws}-${p.agent_b_wins} ${p.agent_b_id}`; return `<div class="card video-card"><h3>${String(i+1).padStart(2,'0')}. ${esc(p.agent_a_id)} vs ${esc(p.agent_b_id)}</h3><p><span class="pill">${esc(score)}</span><span class="pill">draw ${pct(p.draw_rate)}</span><span class="pill">margin ${fmt(p.agent_a_avg_reward_margin,1)}</span></p><video controls preload="metadata" src="${esc(src)}"></video><p class="muted">${esc(rankLabel(p.agent_a_id))} vs ${esc(rankLabel(p.agent_b_id))}，points ${fmt(p.agent_a_points,0)} : ${fmt(p.agent_b_points,0)}</p><p class="src">${esc(src)}</p></div>`}).join('');
 document.getElementById('videos').innerHTML=`<h2>经典比赛视频</h2><p class="muted">视频中的 cyan/orange 是直接染到机器人身体上的颜色，双方换边后颜色仍跟随 agent 本体。</p><div class="video-grid">${cards}</div><h2>所有对局比赛视频（45 个）</h2><p class="muted">以下按 pair 列出本次积分赛录制的全部 45 个对局视频，卡片布局与经典比赛视频一致。</p><div class="video-grid">${allCards}</div>`;
}
function lineChart(el, series, opt={}){
 const w=900,h=250,pad={l:48,r:16,t:18,b:32}; const xs=[],ys=[];
 series.forEach(s=>(s.points||[]).forEach(p=>{xs.push(p[0]);ys.push(p[1])}));
 if(!xs.length){el.innerHTML='<div class="muted" style="padding:20px">no data</div>';return}
 let xmin=Math.min(...xs), xmax=Math.max(...xs), ymin=opt.ymin!==undefined?opt.ymin:Math.min(...ys), ymax=opt.ymax!==undefined?opt.ymax:Math.max(...ys);
 if(ymin===ymax){ymin-=1;ymax+=1} const xmap=x=>pad.l+(x-xmin)/(xmax-xmin||1)*(w-pad.l-pad.r); const ymap=y=>h-pad.b-(y-ymin)/(ymax-ymin)*(h-pad.t-pad.b);
 const grid=[0,.25,.5,.75,1].map(t=>{const y=pad.t+t*(h-pad.t-pad.b); const val=ymax-t*(ymax-ymin); return `<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#e8e4dc"/><text x="6" y="${y+4}" font-size="11" fill="#666">${opt.percent?pct(val):fmt(val,opt.yDigits??0)}</text>`}).join('');
 const paths=series.map((s,i)=>{const pts=(s.points||[]).map(p=>`${xmap(p[0]).toFixed(1)},${ymap(p[1]).toFixed(1)}`).join(' '); const color=s.color||COLORS[i%COLORS.length]; const dash=s.dash?' stroke-dasharray="5 4"':''; return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"${dash}/>`}).join('');
 const marks=(opt.markers||[]).map(m=>{const x=xmap(m.x); return `<line x1="${x}" y1="${pad.t}" x2="${x}" y2="${h-pad.b}" stroke="#9a6700" stroke-dasharray="4 4"/><text x="${x+4}" y="${pad.t+12}" font-size="11" fill="#9a6700">${esc(m.label)}</text>`}).join('');
 const axis=`<line x1="${pad.l}" y1="${h-pad.b}" x2="${w-pad.r}" y2="${h-pad.b}" stroke="#777"/><line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${h-pad.b}" stroke="#777"/><text x="${pad.l}" y="${h-8}" font-size="11" fill="#666">epoch ${xmin}</text><text x="${w-pad.r-64}" y="${h-8}" font-size="11" fill="#666">epoch ${xmax}</text>`;
 const legend='<div class="legend">'+series.map((s,i)=>`<span><i class="sw" style="background:${s.color||COLORS[i%COLORS.length]}"></i>${esc(s.name)}</span>`).join('')+'</div>';
 el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" width="100%" height="100%">${grid}${marks}${paths}${axis}</svg>${legend}`;
}
function renderTraining(){
 const groupRows=DATA.group_summary.map(g=>`<tr><td>${esc(g.group)}</td><td>${esc(g.best_agent)}</td><td>${fmt(g.avg_rank,2)}</td><td>${fmt(g.avg_points,1)}</td><td>${pct(g.avg_win_rate)}</td><td>${signed(g.avg_reward_margin)}</td><td>${g.agents.map(a=>`<span class="pill">${esc(a)}</span>`).join('')}</td></tr>`).join('');
 let html=`<h2>6 组训练曲线与训练诊断</h2><div class="note warn">训练曲线面对的对手不是统一固定池，因此不能直接替代积分赛排名。这里用它观察学习稳定性、agent0/agent1 是否失衡、delayed morph 在 epoch 200 后是否出现明显变化。为降低噪声，图中曲线已使用 9 点居中移动平均平滑；汇总图上排对双 agent 训练组按同 epoch 取 max(agent0, agent1)，下排补充 min(agent0, agent1)，不再使用两者均值；下方表格统计仍基于原始日志。</div><h3>训练组在固定积分赛中的聚合表现</h3><div class="table-wrap"><table><thead><tr><th>训练组</th><th>组内最佳 agent</th><th>平均排名</th><th>平均积分</th><th>平均胜率</th><th>平均 reward margin</th><th>包含 agent</th></tr></thead><tbody>${groupRows}</tbody></table></div><h3>6 组训练曲线汇总（组内 max + min）</h3><div class="grid run-grid"><div class="card"><h3>Best-agent eval reward (MA9, max)</h3><div id="combinedReward" class="chart"></div></div><div class="card"><h3>Best-agent eval win rate (MA9, max)</h3><div id="combinedWin" class="chart"></div></div><div class="card"><h3>Min-agent eval reward (MA9, min)</h3><div id="combinedRewardMin" class="chart"></div></div><div class="card"><h3>Min-agent eval win rate (MA9, min)</h3><div id="combinedWinMin" class="chart"></div></div></div><h3>逐任务训练曲线（MA9 平滑）</h3><div class="grid run-grid">`;
 DATA.training.forEach((r,idx)=>{
   const statRows=r.agents.map(a=>`<tr><td>${esc(a.label)}</td><td>${fmt(a.eval_reward_stats.last,1)}</td><td>${fmt(a.eval_reward_stats.best,1)}</td><td>${pct(a.win_rate_stats.last)}</td><td>${pct(a.win_rate_stats.best)}</td><td>${a.win_rate_stats.trend===null?'-':(a.win_rate_stats.trend>=0?'<span class="pos">+':'<span class="neg">')+fmt(a.win_rate_stats.trend,3)+'</span>'}</td></tr>`).join('');
   html+=`<div class="card"><h3>${esc(r.title)}</h3><p class="src">${esc(r.run_dir)}</p><div id="reward_${r.key}" class="chart small"></div><div id="win_${r.key}" class="chart small"></div><table><thead><tr><th>agent</th><th>last eval R</th><th>best eval R</th><th>last win</th><th>best win</th><th>last100-first100 win</th></tr></thead><tbody>${statRows}</tbody></table><p class="muted">episode length last: ${fmt(r.episode_length_stats.last,1)}, best/max: ${fmt(r.episode_length_stats.best,1)}</p></div>`;
 });
 html+='</div>';
 document.getElementById('training').innerHTML=html;
 lineChart(document.getElementById('combinedReward'), DATA.combined_reward.map((s,i)=>({name:s.name,points:s.points,color:COLORS[i%COLORS.length]})), {yDigits:0, markers:[{x:200,label:'delay morph start'}]});
 lineChart(document.getElementById('combinedWin'), DATA.combined_win.map((s,i)=>({name:s.name,points:s.points,color:COLORS[i%COLORS.length]})), {ymin:0,ymax:1,percent:true, markers:[{x:200,label:'delay morph start'}]});
 lineChart(document.getElementById('combinedRewardMin'), DATA.combined_reward_min.map((s,i)=>({name:s.name,points:s.points,color:COLORS[i%COLORS.length]})), {yDigits:0, markers:[{x:200,label:'delay morph start'}]});
 lineChart(document.getElementById('combinedWinMin'), DATA.combined_win_min.map((s,i)=>({name:s.name,points:s.points,color:COLORS[i%COLORS.length]})), {ymin:0,ymax:1,percent:true, markers:[{x:200,label:'delay morph start'}]});
 DATA.training.forEach((r)=>{
   const rewardSeries=[]; const winSeries=[];
   r.agents.forEach((a,i)=>{const color=i===0?'#087ea4':(i===1?'#d47300':'#198754'); rewardSeries.push({name:`${a.label} eval R`,points:a.eval_reward,color}); if(a.train_reward&&a.train_reward.length) rewardSeries.push({name:`${a.label} train R`,points:a.train_reward,color,dash:true}); winSeries.push({name:`${a.label} eval win`,points:a.win_rate,color});});
   const markers=r.morph_start_epoch?[{x:r.morph_start_epoch,label:'morph start'}]:[];
   lineChart(document.getElementById('reward_'+r.key), rewardSeries, {yDigits:0, markers});
   lineChart(document.getElementById('win_'+r.key), winSeries, {ymin:0,ymax:1,percent:true, markers});
 });
}
