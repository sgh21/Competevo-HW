env_name: robo-sumo-devants-v0
runner_type: multi-evo-agent-runner

agent_specs:
  batch_design: true

gamma: 0.995
tau: 0.95

dev_policy_specs:
  scale_htype: tanh
  scale_mlp: [64, 64]
  scale_log_std: 0
  scale_fix_control_std: false
  control_htype: tanh
  control_mlp: [64, 128, 64]
  control_log_std: 0
  control_fix_control_std: false

policy_optimizer: Adam
policy_lr: 5.0e-5
policy_momentum: 0.0
policy_weightdecay: 0.0

dev_value_specs:
  htype: tanh
  mlp: [64, 64, 64]

value_optimizer: Adam
value_lr: 3.0e-4
value_momentum: 0.0
value_weightdecay: 0.0

l2_reg: 1.0e-3
clip_epsilon: 0.2
min_batch_size: 128
mini_batch_size: 64
eval_batch_size: 20
eval_num_threads: 1
num_optim_epoch: 1
max_epoch_num: 2
seed: 42
save_model_interval: 1

use_entire_obs: false
use_reward_scaling: false
use_opponent_sample: false
delta: 0.5

use_exploration_curriculum: false
termination_epoch: 2
use_parse_reward: false
reward_specs:
  mode: run_to_goal_warmup
