env_name: run-to-goal-ants-v0
runner_type: multi-agent-runner

gamma: 0.995
tau: 0.95
policy_specs:
  name: v5
  htype: tanh
  control_mlp:
    hdims: [128, 128]
    rescale_linear: true
  control_log_std: 0
  fix_control_std: false
policy_optimizer: Adam
policy_lr: 5.0e-5
policy_momentum: 0.0
policy_weightdecay: 0.0
value_specs:
  htype: tanh
  mlp: [512, 256]
value_optimizer: Adam
value_lr: 3.0e-4
value_momentum: 0.0
value_weightdecay: 0.0
clip_epsilon: 0.2
min_batch_size: 128
mini_batch_size: 64
eval_batch_size: 20
eval_num_threads: 1
num_optim_epoch: 1
max_epoch_num: 2
seed: 3
save_model_interval: 1

done_condition:
  max_ang: 60

use_reward_scaling: false
use_opponent_sample: false
delta: 0

use_exploration_curriculum: true
termination_epoch: 2
use_parse_reward: true
